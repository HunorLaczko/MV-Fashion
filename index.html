<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MV-Fashion</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f9f9f7;
      font-family: Georgia, 'Times New Roman', serif;
      color: #1a1a1a;
      padding: 2rem;
    }

    .container {
      max-width: 720px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #666;
      border: 1px solid #ccc;
      border-radius: 2rem;
      padding: 0.3rem 0.9rem;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: normal;
      line-height: 1.4;
      margin-bottom: 1rem;
      color: #111;
    }

    h1 em {
      font-style: italic;
      color: #333;
    }

    .divider {
      width: 3rem;
      height: 2px;
      background-color: #d0c8b0;
      margin: 1.75rem auto;
    }

    .coming-soon {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 1.1rem;
      font-weight: 400;
      color: #555;
      letter-spacing: 0.02em;
    }

    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.95rem;
      color: #666;
      margin-top: 1.25rem;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      padding: 0.55rem 1.25rem;
      border-radius: 2rem;
      border: 1px solid #ccc;
      color: #333;
      background-color: #fff;
      transition: border-color 0.2s, background-color 0.2s, color 0.2s;
    }

    .btn:hover {
      border-color: #888;
      background-color: #f0ede6;
      color: #111;
    }

    .btn svg {
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Research Paper</div>
    <h1>
      MV-Fashion: Towards Enabling Virtual Try-On and Size Estimation
      with <em>Multi-View Paired Data</em>
    </h1>
    <div class="divider"></div>
    <p class="coming-soon">Website coming soon.</p>
    <p class="subtitle">Until then, please read the paper or give us a star on GitHub<br>to get notified when the dataset will be released.</p>
    <div class="buttons">
      <a class="btn" href="https://arxiv.org/abs/2603.08147" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Read the Paper
      </a>
      <a class="btn" href="https://github.com/HunorLaczko/MV-Fashion" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
        Star on GitHub
      </a>
    </div>
  </div>
  <script data-goatcounter="https://mvfashion.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
